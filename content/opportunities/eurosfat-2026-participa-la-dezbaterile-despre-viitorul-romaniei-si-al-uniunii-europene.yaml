title: >-
  EUROSFAT 2026: participă la dezbaterile despre viitorul României și al Uniunii
  Europene
isActive: true
category: for_youth
organization: Europuls – Centrul de Expertiză Europeană
location: București
shortDescription: >-
  Participă la EUROSFAT 2026, organizat de Europuls pe 12–13 noiembrie, la
  București, pentru dezbateri despre democrație, digitalizare și viitorul
  României în Uniunea Europeană. Înscrierile se fac online, pentru sesiunile cu
  locuri disponibile.
fullDescription: >-
  Te interesează politicile europene, democrația și deciziile care influențează
  comunitatea ta? Europuls – Centrul de Expertiză Europeană organizează, în
  perioada 12–13 noiembrie 2026, la București, cea de-a XIV-a ediție a Forumului
  EUROSFAT, sub tema „România și cele 2026 de nuanțe de adevăr”.


  Evenimentul reunește decidenți europeni și naționali, experți, jurnaliști,
  reprezentanți ai societății civile, mediului academic și mediului de afaceri.
  Pentru tinerii interesați de afaceri europene și participare civică, forumul
  oferă ocazia de a urmări dezbateri și de a întâlni oameni implicați în
  formularea politicilor publice.


  Programul include discuții despre democrație, inteligența artificială în
  administrația publică, identitatea digitală, viitorul finanțărilor europene,
  tranziția energetică, adoptarea monedei euro și accesul la justiție. Printre
  invitații speciali se numără Guy Verhofstadt, fost prim-ministru al Belgiei,
  care va participa la sesiunea dedicată democrației și la lansarea cărții sale
  în limba română.


  Participarea este gratuită, pe bază de înscriere, în limita locurilor
  disponibile.


  Evenimentul se desfășoară în două locații:


  - 12 noiembrie: Sala Titulescu a Biroului de Legătură al Parlamentului
  European și a Reprezentanței Comisiei Europene, Strada Vasile Lascăr nr. 31,
  București.

  - 13 noiembrie: Hilton Garden Inn Old Town, Strada Doamnei nr. 12, București.


  Pentru înscriere, completează formularul de pe site-ul oficial și selectează
  sesiunile la care dorești să participi.
