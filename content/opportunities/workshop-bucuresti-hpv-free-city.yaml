fullDescription: >-
  „București - HPV Free City” , organizat de Consiliul Tineretului din România
  și Federația Tinerilor din Cluj, în colaborare cu Merck Sharp & Dohme (MSD). 


  In cadrul evenimentului se va discuta despre prevenția infecțiilor cu HPV,
  promovarea vaccinării și posibile acțiuni prin care putem contribui împreună
  la o mai bună informare și prevenție în București. Evenimentul reunește
  organizații de tineret, reprezentanți ai sectorului medical și ai
  administrației publice.


  Mai sunt doar 25 de locuri disponibile , așa că, dacă te interesează subiectul
  și vrei să participi, te poți înscrie aici:
  https://forms.gle/Kmp7TnJRcC3KNL9x5


  📍 Zbor Hub Politehnica, Splaiul Independenței 313, etajul 2, București

  📅 5 noiembrie 2026

  🕘 09:00 - 13:00


  Termen înscriere: 1 noiembrie 2026, ora 23:59.
